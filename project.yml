name: SkillsManager
options:
  bundleIdPrefix: com.skillsmanager
  deploymentTarget:
    macOS: "14.0"
  defaultConfig: Debug
  xcodeVersion: "15"
  createIntermediateGroups: true

packages:
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    from: "0.4.0"
  MarkdownView:
    url: https://github.com/LiYanan2004/MarkdownView
    from: "2.6.1"

targets:
  SkillsManager:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: SkillsManager
        excludes:
          - "**/*.md"
    resources:
      - path: SkillsManager/Assets.xcassets
      - path: SkillsManager/Resources
    dependencies:
      - package: swift-markdown
        product: Markdown
      - package: MarkdownView
        product: MarkdownView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skillsmanager.SkillsManager
        PRODUCT_NAME: Skills Manager
        PRODUCT_MODULE_NAME: SkillsManager
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: SkillsManager/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          COPY_PHASE_STRIP: YES

  SkillsManagerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/SkillsManagerTests
    dependencies:
      - target: SkillsManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skillsmanager.SkillsManagerTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Skills Manager.app/Contents/MacOS/Skills Manager"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  SkillsManager:
    build:
      targets:
        SkillsManager: all
        SkillsManagerTests: [test]
    test:
      config: Debug
      targets:
        - SkillsManagerTests
    run:
      config: Debug
    archive:
      config: Release
