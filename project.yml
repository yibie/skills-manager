name: SkillsManager
options:
  bundleIdPrefix: com.skillsmanager
  deploymentTarget:
    macOS: "14.0"
  defaultConfig: Debug
  xcodeVersion: "15"
  createIntermediateGroups: true

packages:
  # 本地根 Package:提供 SkillsKernel(Effective-Agent 检视器内核,
  # 含 platform-specs 打包资源;Bundle.module 由 SPM 自动处理)
  SkillsManagerPackage:
    path: .
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    from: "0.4.0"
  MarkdownView:
    url: https://github.com/LiYanan2004/MarkdownView
    from: "2.6.1"

targets:
  SkillsManager:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: SkillsManager
        excludes:
          - "**/*.md"
    resources:
      - path: SkillsManager/Assets.xcassets
      - path: SkillsManager/Resources
    dependencies:
      - package: swift-markdown
        product: Markdown
      - package: MarkdownView
        product: MarkdownView
      - package: SkillsManagerPackage
        product: SkillsKernel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skillsmanager.SkillsManager
        PRODUCT_NAME: Skills Manager
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: SkillsManager/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          COPY_PHASE_STRIP: YES

schemes:
  SkillsManager:
    build:
      targets:
        SkillsManager: all
    run:
      config: Debug
    archive:
      config: Release
