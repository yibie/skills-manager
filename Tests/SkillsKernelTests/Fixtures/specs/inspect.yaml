# inspect(M2)测试用 fixture spec:对应 Fixtures/tree 下的假 home 与假 project。
# 与 valid.yaml 分开维护,避免两组测试的期望值互相牵制。
schema_version: 1

platform:
  id: fixture-platform
  name: Fixture Platform
  version_range: ">=1.0"

metadata:
  generated_by: human
  last_verified: "2026-07-16"

resources:
  - id: global-claude-md
    type: guidance
    scope: global
    path: ~/.claude/CLAUDE.md
    path_kind: file
    source: 测试 fixture
    confidence: high

  - id: project-claude-md
    type: guidance
    scope: project
    path: CLAUDE.md
    path_kind: file
    source: 测试 fixture
    confidence: high

  - id: subdir-claude-md
    type: guidance
    scope: directory
    path: "**/CLAUDE.md"
    path_kind: glob
    source: 测试 fixture
    confidence: high

  - id: global-skills
    type: skill
    scope: global
    path: ~/.claude/skills
    path_kind: directory
    source: 测试 fixture
    confidence: high

  - id: project-skills
    type: skill
    scope: project
    path: .claude/skills
    path_kind: directory
    source: 测试 fixture
    confidence: high

  - id: global-agents
    type: identity
    scope: global
    path: ~/.claude/agents
    path_kind: directory
    source: 测试 fixture
    confidence: high

  - id: project-agents
    type: identity
    scope: project
    path: .claude/agents
    path_kind: directory
    source: 测试 fixture
    confidence: medium

  - id: global-settings
    type: runtime-config
    scope: global
    path: ~/.claude/settings.json
    path_kind: file
    source: 测试 fixture
    confidence: high
    count:
      method: json-keys
      pointer: /hooks
      unit: hook-events

  - id: project-mcp
    type: runtime-config
    scope: project
    path: .mcp.json
    path_kind: file
    source: 测试 fixture
    confidence: high
    count:
      method: json-keys
      pointer: /mcpServers
      unit: servers

  - id: project-settings-local
    type: runtime-config
    scope: project
    path: .claude/settings.local.json
    path_kind: file
    source: 测试 fixture
    confidence: high

  - id: missing-config
    type: runtime-config
    scope: global
    path: ~/.claude/nope.json
    path_kind: file
    required: true
    source: 测试 fixture
    confidence: low

shadowing:
  - id: project-skill-shadows-global
    description: 项目级同名 skill 遮蔽用户级
    strategy: override
    winner: project-skills
    loser: global-skills
    key: skill-directory-name
    source: 测试 fixture
    confidence: high

  - id: project-agent-shadows-global
    description: 项目级同名 subagent 遮蔽用户级
    strategy: override
    winner: project-agents
    loser: global-agents
    key: agent-name
    source: 测试 fixture
    confidence: high

  - id: project-claude-md-refines-global
    description: merge 策略双方都生效,不产生 shadowed
    strategy: merge
    winner: project-claude-md
    loser: global-claude-md
    key: instruction
    source: 测试 fixture
    confidence: high

unmodeled:
  roots:
    - path: ~/.claude
      scope: global
    - path: .claude
      scope: project
  ignore:
    - ~/.claude/projects
    - ~/.claude/.last-*
