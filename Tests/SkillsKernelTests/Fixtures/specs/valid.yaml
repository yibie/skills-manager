# 测试用 fixture spec:对应 Fixtures/tree 下的假 home 与假 project。
schema_version: 1

platform:
  id: fixture-platform
  name: Fixture Platform

metadata:
  generated_by: human
  last_verified: "2026-07-14"

resources:
  - id: global-claude-md
    type: guidance
    scope: global
    path: ~/.claude/CLAUDE.md
    path_kind: file
    source: 测试 fixture
    confidence: high

  - id: global-settings
    type: runtime-config
    scope: global
    path: ~/.claude/settings.json
    path_kind: file
    source: 测试 fixture
    confidence: high
    count:
      method: json-keys
      pointer: /hooks
      unit: hook-events

  - id: global-skills
    type: skill
    scope: global
    path: ~/.claude/skills
    path_kind: directory
    source: 测试 fixture
    confidence: high

  - id: global-missing-file
    type: runtime-config
    scope: global
    path: ~/.claude/nope.json
    path_kind: file
    source: 测试 fixture
    confidence: low

  - id: project-claude-md
    type: guidance
    scope: project
    path: CLAUDE.md
    path_kind: file
    source: 测试 fixture
    confidence: high

  - id: project-mcp
    type: runtime-config
    scope: project
    path: .mcp.json
    path_kind: file
    source: 测试 fixture
    confidence: high
    count:
      method: json-keys
      pointer: /mcpServers
      unit: servers

  - id: project-skills
    type: skill
    scope: project
    path: .claude/skills
    path_kind: directory
    source: 测试 fixture
    confidence: high

  - id: project-settings-local
    type: runtime-config
    scope: project
    path: .claude/settings.local.json
    path_kind: file
    source: 测试 fixture
    confidence: high

  - id: subdir-claude-md
    type: guidance
    scope: directory
    path: "**/CLAUDE.md"
    path_kind: glob
    source: 测试 fixture
    confidence: high

shadowing:
  - id: project-skill-shadows-global
    strategy: override
    winner: project-skills
    loser: global-skills
    key: skill-directory-name
    source: 测试 fixture
    confidence: high

unmodeled:
  roots:
    - path: ~/.claude
      scope: global
    - path: .claude
      scope: project
  ignore:
    - ~/.claude/projects
    - ~/.claude/.last-*
    # agents 目录属于 inspect.yaml(M2)的测试范围,此 spec 不建模,忽略以保持期望值稳定
    - ~/.claude/agents
    - .claude/agents
