# Claude Code Adapter Spec
#
# 提取方法:官方文档 + 本机 ~/.claude 实际布局交叉验证(2026-07-14, macOS,
# Claude Code 2.x)。spec 是先验;用 `skm check` 对照本机做后验校验。
# 不确定的规则标 confidence: low,不省略、不臆造。

schema_version: 1

platform:
  id: claude-code
  name: Claude Code
  version_range: ">=2.0"
  docs_url: https://docs.claude.com/en/docs/claude-code/overview

metadata:
  generated_by: human+ai
  last_verified: "2026-07-14"
  verified_on: "macOS 15 (Darwin 27), Claude Code 2.x, 本机 ~/.claude 交叉验证"
  notes: >-
    本机 ~/.claude 无 CLAUDE.md/skills/agents/commands/rules 目录,这些规则
    以官方文档为准;plugins 布局(cache/<marketplace>/<plugin>/<version>)与
    installed_plugins.json 为本机观察。

resources:
  # ── guidance:CLAUDE.md 层级 ───────────────────────────────────────────
  - id: global-claude-md
    type: guidance
    scope: global
    path: ~/.claude/CLAUDE.md
    path_kind: file
    description: 用户级全局记忆,所有会话注入
    source: https://docs.claude.com/en/docs/claude-code/memory
    confidence: high

  - id: project-claude-md
    type: guidance
    scope: project
    path: CLAUDE.md
    path_kind: file
    description: 项目根 CLAUDE.md,团队共享的项目指令
    source: https://docs.claude.com/en/docs/claude-code/memory
    confidence: high

  - id: project-claude-local-md
    type: guidance
    scope: project
    path: CLAUDE.local.md
    path_kind: file
    description: 项目本地个人记忆(官方已建议改用 imports,但仍会被加载)
    source: https://docs.claude.com/en/docs/claude-code/memory
    confidence: medium

  - id: subdir-claude-md
    type: guidance
    scope: directory
    path: "**/CLAUDE.md"
    path_kind: glob
    description: 子目录 CLAUDE.md,按需加载(读取该子树文件时注入)
    source: https://docs.claude.com/en/docs/claude-code/memory
    confidence: high

  # ── guidance:rules ────────────────────────────────────────────────────
  - id: project-rules
    type: guidance
    scope: project
    path: .claude/rules
    path_kind: directory
    description: 项目级 rules 目录(*.md,可带 glob 前置条件)
    source: https://docs.claude.com/en/docs/claude-code/memory(rules 章节;本机无此目录,未能后验)
    confidence: low

  - id: global-rules
    type: guidance
    scope: global
    path: ~/.claude/rules
    path_kind: directory
    description: 用户级 rules 目录
    source: 与 project-rules 对称推断;本机无此目录,未能后验
    confidence: low

  # ── identity:subagents 与 output styles ─────────────────────────────
  - id: global-agents
    type: identity
    scope: global
    path: ~/.claude/agents
    path_kind: directory
    description: 用户级 subagent 定义(*.md,frontmatter + system prompt)
    source: https://docs.claude.com/en/docs/claude-code/sub-agents
    confidence: high

  - id: project-agents
    type: identity
    scope: project
    path: .claude/agents
    path_kind: directory
    description: 项目级 subagent 定义
    source: https://docs.claude.com/en/docs/claude-code/sub-agents
    confidence: high

  - id: global-output-styles
    type: identity
    scope: global
    path: ~/.claude/output-styles
    path_kind: directory
    description: 用户级 output style(替换/修饰系统提示)
    source: https://docs.claude.com/en/docs/claude-code/output-styles
    confidence: medium

  - id: project-output-styles
    type: identity
    scope: project
    path: .claude/output-styles
    path_kind: directory
    description: 项目级 output style
    source: https://docs.claude.com/en/docs/claude-code/output-styles
    confidence: medium

  # ── skill:skills 与 slash commands ──────────────────────────────────
  - id: global-skills
    type: skill
    scope: global
    path: ~/.claude/skills
    path_kind: directory
    description: 用户级 skills(每个子目录含 SKILL.md)
    source: https://docs.claude.com/en/docs/claude-code/skills
    confidence: high

  - id: project-skills
    type: skill
    scope: project
    path: .claude/skills
    path_kind: directory
    description: 项目级 skills
    source: https://docs.claude.com/en/docs/claude-code/skills
    confidence: high

  - id: shared-global-skills
    type: skill
    scope: global
    path: ~/.agents/skills
    path_kind: directory
    description: 跨 Agent 共享 skills 根(.agents 社区约定);本机存在且被本项目使用
    source: 本机观察(2026-07-14)+ .agents 目录社区约定;官方文档未确认 Claude Code 原生读取
    confidence: low

  - id: shared-project-skills
    type: skill
    scope: project
    path: .agents/skills
    path_kind: directory
    description: 项目内跨 Agent 共享 skills 根
    source: .agents 目录社区约定;官方文档未确认 Claude Code 原生读取
    confidence: low

  - id: plugin-skills
    type: skill
    scope: global
    path: "~/.claude/plugins/cache/*/*/*/skills"
    path_kind: glob
    description: 已安装 plugin 携带的 skills(cache/<marketplace>/<plugin>/<version>/skills)
    source: 本机观察(2026-07-14,installed_plugins.json 的 installPath 布局)
    confidence: medium

  - id: global-commands
    type: skill
    scope: global
    path: ~/.claude/commands
    path_kind: directory
    description: 用户级 slash commands(*.md)
    source: https://docs.claude.com/en/docs/claude-code/slash-commands
    confidence: high

  - id: project-commands
    type: skill
    scope: project
    path: .claude/commands
    path_kind: directory
    description: 项目级 slash commands
    source: https://docs.claude.com/en/docs/claude-code/slash-commands
    confidence: high

  # ── runtime-config:settings / mcp / hooks / plugins ─────────────────
  - id: managed-settings
    type: runtime-config
    scope: global
    path: /Library/Application Support/ClaudeCode/managed-settings.json
    path_kind: file
    description: 企业托管设置(macOS 路径),优先级最高
    source: https://docs.claude.com/en/docs/claude-code/settings
    confidence: medium

  - id: global-settings
    type: runtime-config
    scope: global
    path: ~/.claude/settings.json
    path_kind: file
    description: 用户级设置(model、权限、hooks、enabledPlugins 等)
    source: https://docs.claude.com/en/docs/claude-code/settings;本机观察验证
    confidence: high

  - id: project-settings
    type: runtime-config
    scope: project
    path: .claude/settings.json
    path_kind: file
    description: 项目级共享设置(入库)
    source: https://docs.claude.com/en/docs/claude-code/settings
    confidence: high

  - id: project-settings-local
    type: runtime-config
    scope: project
    path: .claude/settings.local.json
    path_kind: file
    description: 项目级个人设置(不入库,gitignore)
    source: https://docs.claude.com/en/docs/claude-code/settings;本机观察验证
    confidence: high

  - id: project-mcp
    type: runtime-config
    scope: project
    path: .mcp.json
    path_kind: file
    description: 项目级 MCP server 配置
    source: https://docs.claude.com/en/docs/claude-code/mcp
    confidence: high
    count:
      method: json-keys
      pointer: /mcpServers
      unit: servers

  - id: global-state
    type: runtime-config
    scope: global
    path: ~/.claude.json
    path_kind: file
    description: 全局状态文件;用户 scope 的 MCP server 亦存于此(顶层 mcpServers)
    source: 本机观察(2026-07-14)+ https://docs.claude.com/en/docs/claude-code/mcp(user scope)
    confidence: medium
    count:
      method: json-keys
      pointer: /mcpServers
      unit: servers

  - id: global-hooks-config
    type: runtime-config
    scope: global
    path: ~/.claude/settings.json
    path_kind: file
    description: 用户级 hooks(settings.json 的 hooks 键,按事件计数)
    source: https://docs.claude.com/en/docs/claude-code/hooks
    confidence: high
    count:
      method: json-keys
      pointer: /hooks
      unit: hook-events

  - id: project-hooks-config
    type: runtime-config
    scope: project
    path: .claude/settings.json
    path_kind: file
    description: 项目级 hooks(settings.json 的 hooks 键)
    source: https://docs.claude.com/en/docs/claude-code/hooks
    confidence: high
    count:
      method: json-keys
      pointer: /hooks
      unit: hook-events

  - id: global-enabled-plugins
    type: runtime-config
    scope: global
    path: ~/.claude/settings.json
    path_kind: file
    description: 启用的 plugins(settings.json 的 enabledPlugins 键)
    source: 本机观察(2026-07-14);https://docs.claude.com/en/docs/claude-code/plugins
    confidence: medium
    count:
      method: json-keys
      pointer: /enabledPlugins
      unit: plugins

  - id: installed-plugins
    type: runtime-config
    scope: global
    path: ~/.claude/plugins/installed_plugins.json
    path_kind: file
    description: 已安装 plugin 清单(plugins 键)
    source: 本机观察(2026-07-14)
    confidence: medium
    count:
      method: json-keys
      pointer: /plugins
      unit: plugins

  - id: global-keybindings
    type: runtime-config
    scope: global
    path: ~/.claude/keybindings.json
    path_kind: file
    description: 自定义键位绑定
    source: Claude Code keybindings 功能;本机无此文件,未能后验
    confidence: low

shadowing:
  # settings 分层:managed > 项目 local > 项目 > 用户全局(拆成两两 merge 规则)
  - id: managed-over-project-local
    description: 企业托管设置覆盖项目本地设置
    strategy: merge
    winner: managed-settings
    loser: project-settings-local
    key: settings-key
    source: https://docs.claude.com/en/docs/claude-code/settings
    confidence: medium

  - id: project-local-over-project
    description: 项目本地设置覆盖项目共享设置
    strategy: merge
    winner: project-settings-local
    loser: project-settings
    key: settings-key
    source: https://docs.claude.com/en/docs/claude-code/settings
    confidence: high

  - id: project-over-global-settings
    description: 项目设置覆盖用户全局设置
    strategy: merge
    winner: project-settings
    loser: global-settings
    key: settings-key
    source: https://docs.claude.com/en/docs/claude-code/settings
    confidence: high

  # skills / agents / commands:项目级同名遮蔽全局
  - id: project-skill-shadows-global
    description: 项目级同名 skill 遮蔽用户级
    strategy: override
    winner: project-skills
    loser: global-skills
    key: skill-directory-name
    source: https://docs.claude.com/en/docs/claude-code/skills
    confidence: medium

  - id: project-agent-shadows-global
    description: 项目级同名 subagent 遮蔽用户级
    strategy: override
    winner: project-agents
    loser: global-agents
    key: agent-name
    source: https://docs.claude.com/en/docs/claude-code/sub-agents
    confidence: high

  - id: project-command-shadows-global
    description: 项目级同名 slash command 优先(历史版本曾允许共存加后缀区分)
    strategy: override
    winner: project-commands
    loser: global-commands
    key: command-name
    source: https://docs.claude.com/en/docs/claude-code/slash-commands;行为随版本有变化
    confidence: low

  # CLAUDE.md:全部生效、叠加注入,更具体的在后(冲突处项目级优先)
  - id: project-claude-md-refines-global
    description: 项目 CLAUDE.md 与全局 CLAUDE.md 叠加,冲突处项目级优先
    strategy: merge
    winner: project-claude-md
    loser: global-claude-md
    key: instruction
    source: https://docs.claude.com/en/docs/claude-code/memory
    confidence: high

unmodeled:
  roots:
    - path: ~/.claude
      scope: global
    - path: .claude
      scope: project
  ignore:
    # ~/.claude 下已确认的会话状态/缓存(本机观察 2026-07-14),非 Agent Resource
    - ~/.claude/projects
    - ~/.claude/sessions
    - ~/.claude/session-env
    - ~/.claude/shell-snapshots
    - ~/.claude/history.jsonl
    - ~/.claude/cache
    - ~/.claude/image-cache
    - ~/.claude/paste-cache
    - ~/.claude/file-history
    - ~/.claude/backups
    - ~/.claude/downloads
    - ~/.claude/jobs
    - ~/.claude/plans
    - ~/.claude/chrome
    - ~/.claude/telemetry
    - ~/.claude/todos
    - ~/.claude/statsig
    - ~/.claude/ide
    - ~/.claude/daemon*
    - ~/.claude/.last-*
    - ~/.claude/.credentials.json
    # 项目 .claude 下的本仓库工作产物
    - .claude/worktrees
